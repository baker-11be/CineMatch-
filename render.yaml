# ============================================================================
# Render Blueprint — CineMatch
# ----------------------------------------------------------------------------
# CineMatch is a *plain static site* (HTML/CSS/JS modules calling the TMDB API
# from the browser). `npm run build` (scripts/build.mjs) copies the site files
# into ./dist, and Render publishes that folder.
#
# DASHBOARD SETTINGS (Settings > Build & Deploy) if the service was created
# manually:
#     Branch:            main
#     Build Command:     npm install && npm run build
#     Publish Directory: dist
#
# ENVIRONMENT (Settings > Environment):
#     TMDB_API_KEY = <your TMDB v3 API key>
#   The build writes it into dist/config.js so the key is not stored in git.
# ============================================================================

services:
  - type: web
    name: cinematch
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: TMDB_API_KEY
        sync: false
